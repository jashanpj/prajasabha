name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prajasabha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm biome check .

      - name: Type check
        run: pnpm -r exec tsc --noEmit

      - name: Migration dry-run (packages/db)
        run: pnpm --filter db exec drizzle-kit check
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/prajasabha_test

      - name: Migration dry-run (packages/vault-db)
        run: pnpm --filter vault-db exec drizzle-kit check
        env:
          VAULT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prajasabha_test

      - name: Unit + endpoint authz tests
        run: pnpm -r test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/prajasabha_test
          VAULT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/prajasabha_test
          # app_role/vault_role are created idempotently by packages/db's
          # migration 0002 and packages/vault-db's migration 0000 (CI has no
          # docker-compose init script) — same dev-only passwords documented
          # there and in docker/postgres/init/01-schemas-and-roles.sql.
          APP_DATABASE_URL: postgres://app_role:app_role_dev_only@localhost:5432/prajasabha_test
          VAULT_SVC_DATABASE_URL: postgres://vault_role:vault_role_dev_only@localhost:5432/prajasabha_test

      - name: i18n parity check
        run: pnpm exec node scripts/check-i18n-parity.mjs

      - name: Install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        run: pnpm exec playwright test --project=chromium tests/smoke

      - name: Bundle-size budget
        run: pnpm exec node scripts/check-bundle-budget.mjs
