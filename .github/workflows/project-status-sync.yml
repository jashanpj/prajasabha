name: Project status sync

# Keeps the PrajaSabha Projects (v2) board's Status field in sync with PR
# lifecycle. GitHub's built-in Projects "Workflows" panel (project page ->
# Settings -> Workflows) only covers coarse triggers (item added, item
# closed, PR merged, auto-archive) via the web UI, and there is no public
# API to configure it — confirmed by introspecting the GraphQL schema:
# only `deleteProjectV2Workflow` exists, no create/update mutation. This
# reimplements the two transitions the dev-process-playbook's daily loop
# actually needs (PR opened -> In Review, PR merged -> Done) by calling
# updateProjectV2ItemFieldValue directly.
#
# Requires a repo secret PROJECTS_TOKEN: a classic PAT with the `project`
# scope. The default GITHUB_TOKEN cannot write to a user-owned Projects v2
# board (only org-owned ones support that). Create one at
# https://github.com/settings/tokens/new?scopes=project and run:
#   gh secret set PROJECTS_TOKEN
# Until that secret exists, this workflow no-ops cleanly rather than
# failing (see the "Check token" step).

on:
  pull_request:
    types: [opened, reopened, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to test against"
        required: true
      status:
        description: "Status to set"
        required: true
        type: choice
        options: [Backlog, Ready, "In Progress", "In Review", Staging, Done]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: check-token
        run: |
          if [ -z "${{ secrets.PROJECTS_TOKEN }}" ]; then
            echo "PROJECTS_TOKEN secret not set — skipping (see workflow file header for setup)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/github-script@v7
        if: steps.check-token.outputs.present == 'true'
        with:
          github-token: ${{ secrets.PROJECTS_TOKEN }}
          script: |
            const owner = "jashanpj";
            const projectNumber = 2;

            async function getProject() {
              const res = await github.graphql(
                `query($owner: String!, $number: Int!) {
                  user(login: $owner) {
                    projectV2(number: $number) {
                      id
                      fields(first: 20) {
                        nodes {
                          ... on ProjectV2SingleSelectField { id name options { id name } }
                        }
                      }
                    }
                  }
                }`,
                { owner, number: projectNumber }
              );
              return res.user.projectV2;
            }

            async function findItemForIssue(projectId, issueNumber) {
              let cursor = null;
              for (;;) {
                const res = await github.graphql(
                  `query($projectId: ID!, $cursor: String) {
                    node(id: $projectId) {
                      ... on ProjectV2 {
                        items(first: 100, after: $cursor) {
                          nodes { id content { ... on Issue { number } } }
                          pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`,
                  { projectId, cursor }
                );
                const items = res.node.items;
                const match = items.nodes.find((n) => n.content && n.content.number === issueNumber);
                if (match) return match.id;
                if (!items.pageInfo.hasNextPage) return null;
                cursor = items.pageInfo.endCursor;
              }
            }

            async function setStatus(projectId, itemId, fieldId, optionId) {
              await github.graphql(
                `mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId, itemId: $itemId, fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }`,
                { projectId, itemId, fieldId, optionId }
              );
            }

            let issueNumbers = [];
            let targetStatusName = null;

            if (context.eventName === "workflow_dispatch") {
              issueNumbers = [parseInt(context.payload.inputs.issue_number, 10)];
              targetStatusName = context.payload.inputs.status;
            } else {
              const pr = context.payload.pull_request;
              const body = pr.body || "";
              const matches = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)];
              issueNumbers = [...new Set(matches.map((m) => parseInt(m[1], 10)))];

              if (context.payload.action === "closed" && pr.merged) {
                targetStatusName = "Done";
              } else if (context.payload.action === "opened" || context.payload.action === "reopened") {
                targetStatusName = "In Review";
              }
            }

            if (!targetStatusName || issueNumbers.length === 0) {
              console.log("Nothing to do:", { issueNumbers, targetStatusName });
              return;
            }

            const project = await getProject();
            const statusField = project.fields.nodes.find((f) => f && f.name === "Status");
            const option = statusField.options.find((o) => o.name === targetStatusName);
            if (!option) {
              core.setFailed(`No Status option named "${targetStatusName}"`);
              return;
            }

            for (const issueNumber of issueNumbers) {
              const itemId = await findItemForIssue(project.id, issueNumber);
              if (itemId) {
                await setStatus(project.id, itemId, statusField.id, option.id);
                console.log(`Set #${issueNumber} to "${targetStatusName}"`);
              } else {
                console.log(`No project item found for #${issueNumber} — skipping`);
              }
            }
