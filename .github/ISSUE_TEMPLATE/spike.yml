name: Spike
description: A time-boxed investigation with no guaranteed shippable output
title: "[Spike] "
labels: ["type:spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question to answer
    validations:
      required: true
  - type: input
    id: timebox
    attributes:
      label: Timebox
      placeholder: "e.g. 1 day"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: A decision, a doc, a prototype — what "done" looks like for this spike.
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - "A"
        - "B"
        - "C"
        - "D"
        - "E"
        - "F"
        - "G"
        - "H"
        - "I"
        - "J"
        - "K"
        - "L"
