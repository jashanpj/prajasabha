# Local dev Postgres for PrajaSabha (issue #14).
#
# Single container, single database, two SCHEMAS — `public` (participation
# DB, packages/db) and `vault` (identity vault). This collapses HLD §4.1's
# two-separate-Supabase-projects prod topology into one box for local dev
# convenience only; it is NOT the security boundary. Isolation here is
# enforced by schema + role separation (see docker/postgres/init/), so a
# query issued as `app_role` against `vault.*` fails with a real Postgres
# permission error — but this is still one physical database, one operator,
# one blast radius. Never point staging/prod config at this compose file.
#
# Matches CI's postgres:16 / postgres:postgres convention (.github/workflows/ci.yml)
# so behavior is consistent between local dev and CI, even though CI runs
# its own service container rather than this file.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prajasabha_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
